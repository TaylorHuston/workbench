[project]
name = "pkm-api"
version = "0.5.0"
description = "Composable REST API spike for controlled PKM and vault workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0,<1",
    "openai-codex>=0.156.0,<0.157",
    "pyyaml>=6.0.2,<7",
    "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0,<3",
    "pytest>=8.4.1,<9",
    "ruff>=0.12.0,<1",
]

[project.scripts]
pkm-api = "pkm_api.__main__:main"
pkm-api-codex-auth-check = "pkm_api.codex_auth_check:main"
pkm-api-worker = "pkm_api.worker_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkm_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
