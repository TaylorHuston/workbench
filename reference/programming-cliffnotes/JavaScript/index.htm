<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vanilla JavaScript Examples</title>
</head>

<body>

  <h1>This is a Header</h1>

  <div id="someParent">
    <ul id="myList">
      <li>List 1</li>
      <li>List 2</li>
      <li>
        Sublist
        <ul>
          <li>Sublist 1</li>
          <li>Sublist 2</li>
        </ul>
      </li>
      <li>List 3</li>
    </ul>
  </div>


  <h2>Scripts</h2>

  <button type="button" id="variables">variables.js</button>
  <button type="button" id="inputOutput">input-output.js</button>
  <button type="button" id="flowControl">flow-control.js</button>
  <button type="button" id="functions">functions.js</button>
  <button type="button" id="arrays">arrays.js</button>
  <button type="button" id="strings">strings.js</button>
  <button type="button" id="dates">date.js</button>
  <button type="button" id="objects">basic-objects.js</button>
  <button type="button" id="dom">working-with-dom.js</button>
  <button type="button" id="jQuery">jq-stuff.js</button>

  <form id="myForm" name="formName" method="post">
    <p>
      <label for="name">Name:</label>
      <input type="text" name="name" id="name" tabindex="10" />
    </p>

    <p>
      <label for="email">Email:</label>
      <input type="text" value="your email" name="email" id="email" tabindex="20" />
    </p>
    <p>
      <label for="myCheckbox">Checkbox:</label>
      <input type="checkbox" name="myCheckbox" id="myCheckbox">
    </p>
    <p>
      <input type="submit" name="submit" id="submitBtn" value="Submit">
    </p>


  </form>

  <div id="slideshow">
    <img id="slideImage">
  </div>

  <div id="addingElements">
    <p id="mainParagraph">Base </p>
  </div>

  <button id="clickToShow">Click to Show</button>
  <div style="width: 300px; height: 300px;">
    <div id="slideout" style="width: 100px; height: 100px; float: right; display: none; background-color: red;"></div>
    <div id="fadein" style="width: 100px; height: 100px; float: left; display: none; background-color: blue;"></div>
  </div>

  <button type="button" id="my-button">DOM event button</button>

  <h2>Click me!</h2>

  <div id="ajax"></div>

  <div id="scripts">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="input-output.js"></script>
    <script src="flow-control.js"></script>
    <script src="functions.js"></script>
    <script src="variables.js"></script>
    <script src="arrays.js"></script>
    <script src="strings.js"></script>
    <script src="date.js"></script>
    <script src="basic-objects.js"></script>
    <script src="working-with-dom.js"></script>
    <script src="jq-stuff.js"></script>
    <script>
      const examples = {
        variables,
        flowControl,
        functions,
        arrays,
        strings,
        dates: dateExamples,
        objects,
      };

      for (const [buttonId, runExample] of Object.entries(examples)) {
        document.getElementById(buttonId)?.addEventListener("click", runExample);
      }
    </script>

  </div>

</body>

</html>
